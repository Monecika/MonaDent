openapi: 3.0.3
info:
  title: Mona Dent Users API
  version: 1.0.0
paths:
  /users/doctors:
    get:
      tags:
        - Users
      operationId: getDoctors
      summary: List active doctors for a branch
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      tags:
        - Users
      operationId: getAllUsers
      summary: List users accessible to the current administrator or branch manager
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Users
      operationId: createUser
      summary: Create a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or phone number is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    get:
      tags:
        - Users
      operationId: getMe
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Users
      operationId: updateMe
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}:
    put:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user as an administrator or same-branch manager
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or phone number is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      type: string
      enum:
        - ADMIN
        - DOCTOR
        - RECEPTIONIST
        - ASSISTANT
        - MANAGER
    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    DoctorResponse:
      type: object
      required:
        - doctorId
        - name
        - surname
      properties:
        doctorId:
          type: string
          format: uuid
        name:
          type: string
        surname:
          type: string
        calendarColor:
          type: string
    ErrorResponse:
      type: object
      required:
        - status
        - errorType
        - message
      properties:
        status:
          type: integer
          format: int32
        errorType:
          type: string
        message:
          type: string
    CreateUserRequest:
      type: object
      required:
        - name
        - surname
        - email
        - phone
        - role
        - password
      properties:
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
        calendarColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          maxLength: 7
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          minLength: 8
          maxLength: 100
    UpdateUserRequest:
      type: object
      properties:
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
        calendarColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          maxLength: 7
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
    UpdateMeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
        calendarColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          maxLength: 7
        preferredLanguage:
          type: string
          enum: [ro, ru, en]
    UserResponse:
      type: object
      required:
        - userId
        - branchIds
        - name
        - surname
        - email
        - phone
        - dateOfBirth
        - role
        - status
        - preferredLanguage
      properties:
        userId:
          type: string
          format: uuid
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        calendarColor:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        preferredLanguage:
          type: string
          enum: [ro, ru, en]
