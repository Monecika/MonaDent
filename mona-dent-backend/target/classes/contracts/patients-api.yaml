openapi: 3.0.3
info:
  title: Mona Dent Patients API
  version: 1.0.0
paths:
  /patients:
    get:
      tags:
        - Patients
      operationId: getPatients
      summary: Get all patients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientResponse'
    post:
      tags:
        - Patients
      operationId: createPatient
      summary: Create a patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
  /patients/{patientId}:
    get:
      tags:
        - Patients
      operationId: getPatient
      summary: Get a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '404':
          description: Patient not found
    put:
      tags:
        - Patients
      operationId: updatePatient
      summary: Update a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '404':
          description: Patient not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreatePatientRequest:
      type: object
      required:
        - name
        - surname
        - dateOfBirth
        - phone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
          minLength: 1
          maxLength: 30
    UpdatePatientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
          minLength: 1
          maxLength: 30
    PatientResponse:
      type: object
      required:
        - patientId
        - name
        - surname
        - dateOfBirth
        - phone
        - createdAt
      properties:
        patientId:
          type: string
          format: uuid
        name:
          type: string
        surname:
          type: string
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
