openapi: 3.0.3
info:
  title: Mona Dent Patient Teeth API
  version: 1.0.0
paths:
  /patients/{patientId}/teeth:
    get:
      tags:
        - Patient Teeth
      operationId: getPatientTeeth
      summary: Get all teeth recorded for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient teeth
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientToothResponse'
        '404':
          description: Patient not found
    post:
      tags:
        - Patient Teeth
      operationId: addPatientTooth
      summary: Add a tooth or replace the tooth in the same position
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientToothRequest'
      responses:
        '201':
          description: Tooth added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientToothResponse'
        '400':
          description: Invalid tooth number or type
        '404':
          description: Patient not found
        '409':
          description: A tooth of this type already exists in this position
  /patients/{patientId}/teeth/{toothId}:
    put:
      tags:
        - Patient Teeth
      operationId: updatePatientTooth
      summary: Update an individual patient's tooth
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: toothId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientToothRequest'
      responses:
        '200':
          description: Tooth updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientToothResponse'
        '404':
          description: Patient tooth not found
  /patients/{patientId}/teeth/history:
    get:
      tags:
        - Patient Teeth
      operationId: getPatientToothHistory
      summary: Get the patient's tooth history
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tooth history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientToothHistoryResponse'
        '404':
          description: Patient not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ToothFinding:
      type: string
      enum:
        - NOT_ASSESSED
        - HEALTHY
        - CARIES
        - PULPITIS
        - PERIODONTITIS
        - PERIODONTAL_DISEASE
        - ROOT_PROBLEM
        - FILLING
        - CROWN
        - IMPLANT
        - MISSING
    MobilityGrade:
      type: integer
      minimum: 1
      maximum: 3
    ToothType:
      type: string
      enum:
        - PRIMARY
        - PERMANENT
    CreatePatientToothRequest:
      type: object
      required:
        - toothNumber
        - toothType
      properties:
        toothNumber:
          type: integer
          description: FDI tooth number; the number must match the specified toothType.
          minimum: 11
          maximum: 85
        toothType:
          $ref: '#/components/schemas/ToothType'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ToothFinding'
        mobilityGrade:
          $ref: '#/components/schemas/MobilityGrade'
        notes:
          type: string
    UpdatePatientToothRequest:
      type: object
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ToothFinding'
        mobilityGrade:
          allOf:
            - $ref: '#/components/schemas/MobilityGrade'
          nullable: true
        notes:
          type: string
    PatientToothResponse:
      type: object
      required:
        - toothId
        - patientId
        - toothNumber
        - toothType
        - findings
      properties:
        toothId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        toothNumber:
          type: integer
        toothType:
          $ref: '#/components/schemas/ToothType'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ToothFinding'
        mobilityGrade:
          $ref: '#/components/schemas/MobilityGrade'
        notes:
          type: string
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    PatientToothHistoryResponse:
      type: object
      required:
        - historyId
        - patientToothId
        - toothNumber
        - toothType
        - eventType
        - oldFindings
        - newFindings
        - description
        - changedBy
        - changedAt
      properties:
        historyId:
          type: string
          format: uuid
        patientToothId:
          type: string
          format: uuid
        toothNumber:
          type: integer
        toothType:
          $ref: '#/components/schemas/ToothType'
        previousToothNumber:
          type: integer
        previousToothType:
          $ref: '#/components/schemas/ToothType'
        eventType:
          type: string
        oldFindings:
          type: array
          items:
            $ref: '#/components/schemas/ToothFinding'
        newFindings:
          type: array
          items:
            $ref: '#/components/schemas/ToothFinding'
        oldMobilityGrade:
          $ref: '#/components/schemas/MobilityGrade'
        newMobilityGrade:
          $ref: '#/components/schemas/MobilityGrade'
        description:
          type: string
        notes:
          type: string
        changedBy:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
