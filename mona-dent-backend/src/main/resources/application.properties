spring.application.name=mona-dent-backend
server.port=${MONA_DENT_PORT:8080}

spring.datasource.url=${MONA_DENT_DB_URL:jdbc:postgresql://localhost:5432/clinic_db}
spring.datasource.username=${MONA_DENT_DB_USERNAME:mona}
spring.datasource.password=${MONA_DENT_DB_PASSWORD:mona}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Keep patient files outside the installation directory so upgrades do not remove them.
# Override with MONA_DENT_FILES_DIRECTORY when provisioning a client installation.
app.files.directory=${MONA_DENT_FILES_DIRECTORY:${user.home}/.mona-dent/files}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Base64-encoded 256-bit secret — replace in production
security.jwt.secret-key=${MONA_DENT_JWT_SECRET:bW9uYS1kZW50LWp3dC1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLWVudg==}
security.jwt.expiration-time=86400000

# Leave empty to deny all API traffic until the host's public IPv4 is registered.
# Set through SECURITY_IP_ALLOWLIST_INITIAL_IP when provisioning a new installation.
security.ip-allowlist.initial-ip=${SECURITY_IP_ALLOWLIST_INITIAL_IP:}
security.ip-allowlist.initial-name=${SECURITY_IP_ALLOWLIST_INITIAL_NAME:Initial host}
