openapi: 3.0.3
info:
  title: Mona Dent Appointments API
  version: 1.0.0
paths:
  /appointments:
    get:
      tags:
        - Appointments
      operationId: getAppointments
      summary: Get appointments for a branch, optionally filtered by date
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Calendar date in the server's default time zone
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Branch appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '403':
          description: User is not assigned to this branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Appointments
      operationId: createAppointment
      summary: Create an appointment in an assigned branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '403':
          description: User is not assigned to this branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /appointments/{appointmentId}:
    put:
      tags:
        - Appointments
      operationId: updateAppointment
      summary: Update an appointment in an assigned branch
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '403':
          description: User is not assigned to the appointment branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Appointments
      operationId: deleteAppointment
      summary: Delete an appointment in an assigned branch
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Appointment deleted
        '403':
          description: User is not assigned to the appointment branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /appointments/patient/{patientId}:
    get:
      tags:
        - Appointments
      operationId: getPatientAppointments
      summary: Get all appointments for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /appointments/patient/{patientId}/next:
    get:
      tags:
        - Appointments
      operationId: getNextPatientAppointment
      summary: Get the next future appointment for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The patient's next appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '204':
          description: Patient has no upcoming appointment
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - errorType
        - message
      properties:
        status:
          type: integer
          format: int32
        errorType:
          type: string
        message:
          type: string
    AppointmentStatus:
      type: string
      enum:
        - SCHEDULED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - NO_SHOW
    CreateAppointmentRequest:
      type: object
      required:
        - branchId
        - patientId
        - userId
        - appointmentDate
        - durationMinutes
      properties:
        branchId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        appointmentDate:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        description:
          type: string
        notes:
          type: string
    UpdateAppointmentRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        appointmentDate:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        description:
          type: string
        notes:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
    AppointmentResponse:
      type: object
      required:
        - appointmentId
        - branchName
        - patient
        - employee
        - appointmentDate
        - durationMinutes
        - status
      properties:
        appointmentId:
          type: string
          format: uuid
        branchName:
          type: string
        patient:
          $ref: '#/components/schemas/AppointmentPatient'
        employee:
          $ref: '#/components/schemas/AppointmentEmployee'
        appointmentDate:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        description:
          type: string
        notes:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
    AppointmentEmployee:
      type: object
      required:
        - employeeId
        - role
        - name
        - surname
      properties:
        employeeId:
          type: string
          format: uuid
        role:
          type: string
          example: "Dr."
        name:
          type: string
        surname:
          type: string
    AppointmentPatient:
      type: object
      required:
        - patientId
        - name
        - surname
        - dateOfBirth
        - phone
        - createdAt
      properties:
        patientId:
          type: string
          format: uuid
        name:
          type: string
        surname:
          type: string
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
