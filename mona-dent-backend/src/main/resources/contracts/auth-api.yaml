openapi: 3.0.3
info:
  title: Mona Dent Auth API
  version: 1.0.0
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me/password:
    put:
      tags:
        - Auth
      operationId: updateMyPassword
      summary: Update the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          description: Invalid password update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UpdatePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 100
    AuthResponse:
      type: object
      required:
        - accessToken
        - userId
        - email
        - role
        - mustChangePassword
      properties:
        accessToken:
          type: string
        userId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        mustChangePassword:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - status
        - errorType
        - message
      properties:
        status:
          type: integer
          format: int32
          example: 401
        errorType:
          type: string
          example: Authentication Failed
        message:
          type: string
          example: Password or email incorrect
