<app-base-form
  (close)="closeForm()"
  (submit)="submitForm()"
  [formTitle]="(isEditing ? 'Edit Patient' : 'New Patient') | translate"
  [submitButton]="
    (isSubmitting()
      ? isEditing
        ? 'Saving...'
        : 'Creating...'
      : isEditing
        ? 'Save Changes'
        : 'Create Patient') | translate
  "
  [submitDisabled]="isSubmitting()"
>
  <ng-container [formGroup]="form">
    <div>
      <label for="patient-name">{{ 'Name' | translate }}</label>
      <input
        id="patient-name"
        type="text"
        maxlength="100"
        required
        autocomplete="off"
        formControlName="name"
        [class.border-error]="form.controls.name.invalid && form.controls.name.touched"
      />
    </div>

    <div>
      <label for="patient-surname">{{ 'Surname' | translate }}</label>
      <input
        id="patient-surname"
        type="text"
        maxlength="100"
        required
        autocomplete="off"
        formControlName="surname"
        [class.border-error]="form.controls.surname.invalid && form.controls.surname.touched"
      />
    </div>

    <div>
      <label for="patient-date-of-birth">{{ 'Date of birth' | translate }}</label>
      <app-custom-calendar
        [value]="form.controls.dateOfBirth.value"
        [selectedDate]="selectedDateForCalendar()"
        [minYear]="1900"
        [maxYear]="currentYear"
        [invalid]="form.controls.dateOfBirth.invalid && form.controls.dateOfBirth.touched"
        [placeholder]="'Select date of birth' | translate"
        (dateSelected)="onDateOfBirthSelected($event)"
      />

      @if (form.controls.dateOfBirth.value) {
        <button
          type="button"
          class="mt-1 self-start text-xs text-secondary hover:text-primary"
          (click)="clearDateOfBirth()"
        >
          {{ 'Clear date' | translate }}
        </button>
      }
    </div>

    <div>
      <label>{{ 'Gender' | translate }}</label>
      <app-custom-select-input
        [options]="genderOptions"
        [placeholder]="'Select gender' | translate"
        [value]="form.controls.gender.value"
        [invalid]="form.controls.gender.invalid && form.controls.gender.touched"
        (valueChange)="setGender($event)"
      />
    </div>

    <div>
      <label for="patient-phone">{{ 'Phone' | translate }}</label>
      <input
        id="patient-phone"
        type="tel"
        maxlength="30"
        required
        autocomplete="off"
        formControlName="phone"
        [class.border-error]="form.controls.phone.invalid && form.controls.phone.touched"
      />
    </div>

    <div>
      <label for="patient-profession">{{ 'Profession' | translate }} <span class="text-secondary">({{ 'Optional' | translate }})</span></label>
      <input id="patient-profession" type="text" maxlength="150" formControlName="profession" />
    </div>

    <div class="col-span-full">
      <label for="patient-home-address">{{ 'Home address' | translate }}</label>
      <input
        id="patient-home-address"
        type="text"
        maxlength="255"
        required
        autocomplete="street-address"
        formControlName="homeAddress"
        [class.border-error]="form.controls.homeAddress.invalid && form.controls.homeAddress.touched"
      />
    </div>

    <div>
      <label for="patient-allergies">{{ 'Allergies' | translate }} <span class="text-secondary">({{ 'Optional' | translate }})</span></label>
      <textarea id="patient-allergies" rows="2" formControlName="allergies"></textarea>
    </div>

    <div>
      <label for="patient-diseases">{{ 'Diseases' | translate }} <span class="text-secondary">({{ 'Optional' | translate }})</span></label>
      <textarea id="patient-diseases" rows="2" formControlName="diseases"></textarea>
    </div>

    @if (validationError) {
      <p class="col-span-full text-sm text-error">
        {{ validationError | translate }}
      </p>
    }

    @if (errorMessage()) {
      <p class="col-span-full text-sm text-error">
        {{ errorMessage() | translate }}
      </p>
    }
  </ng-container>
</app-base-form>
