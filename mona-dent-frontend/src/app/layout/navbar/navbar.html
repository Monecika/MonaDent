<nav class="grid grid-cols-2 items-center gap-3 border-b border-border px-3 py-3 sm:px-4 lg:flex lg:flex-nowrap lg:gap-5 lg:px-5">
  <app-custom-select class="col-span-2 order-1 w-full min-w-0 md:col-span-1 md:order-1 lg:order-1 lg:w-1/5" />
  <div class="order-3 min-w-0 md:order-2 lg:order-3 lg:w-36 lg:flex-none" [attr.aria-label]="'Language' | translate">
      <span class="mb-1 block text-xs font-medium text-secondary lg:sr-only">{{ 'Language' | translate }}</span>
      <app-custom-select-input
        [options]="languages"
        [value]="language()"
        [disabled]="!user()"
        (selectionChange)="onLanguageChange($event)"
        [placeholder]="'Language' | translate"
        [searchPlaceholder]="'Search' | translate"
      />
      @if (languageSaveError()) {
        <p class="mt-1 text-xs text-error">{{ languageSaveError() }}</p>
      }
  </div>
  <app-searchbar class="col-span-2 order-2 w-full min-w-0 md:col-span-1 md:order-3 lg:order-2 lg:flex-1" [placeholder]="'Search by patient name or phone number' | translate" (searchSubmit)="onSearch($event)"/>
  <app-user-dropdown class="order-4 w-full min-w-0 md:order-4 lg:order-4 lg:w-1/5" />
</nav>
@if (userLoadError()) {
  <p class="border-b border-border px-5 py-2 text-sm text-error" role="alert">
    {{ userLoadError() }}
  </p>
}
