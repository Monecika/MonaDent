@if (branchStore.isLoading()) {
  <app-loader />
}

<div class="relative">
  <button
    type="button"
    class="group flex w-full cursor-pointer items-center justify-between rounded-xl border border-border bg-background p-2 transition hover:border-border-hover hover:bg-background-hover"
    (click)="openSubsidiary()"
  >
    <div class="flex min-w-0 items-center gap-2">
      <div class="shrink-0 rounded-full bg-accent-bg p-2 transition group-hover:bg-accent-bg-hover md:p-3">
        <svg lucideBuildingComplex class="size-4 text-accent transition group-hover:scale-110 md:size-5"></svg>
      </div>

      <div class="min-w-0 text-left">
        <p class="text-[10px] text-secondary">{{ 'Active Branch' | translate }}</p>
        <p class="truncate text-xs font-bold text-primary">
          {{ branchStore.selectedBranch()?.name ?? ('Select branch' | translate) }}
        </p>
      </div>
    </div>

    <svg
      lucideChevronDown
      class="size-5 text-primary transition-transform duration-300"
      [class.rotate-180]="isOpen"
    ></svg>
  </button>

  @if (branchStore.loadError()) {
    <p class="mt-1 text-xs text-error" role="alert">{{ branchStore.loadError() }}</p>
  }

  @if (isOpen) {
    <div class="absolute z-50 mt-2 w-full rounded-xl border border-border bg-white p-2 shadow-lg">
      <p class="px-2 py-1 text-[10px] text-secondary">{{ 'Select Branch' | translate }}</p>

      @for (option of branchStore.branches() ?? []; track option.branchId) {
        <button
          type="button"
          class="group flex w-full cursor-pointer items-center gap-2 rounded-xl p-2 hover:bg-accent-bg"
          [class.bg-accent-bg]="branchStore.selectedBranch()?.branchId === option.branchId"
          (click)="selectSubsidiary(option)"
        >
          <svg
            lucideBuildingComplex
            class="size-5 text-secondary group-hover:text-accent"
            [class.text-accent]="branchStore.selectedBranch()?.branchId === option.branchId"
          ></svg>

          <div class="text-left">
            <p
              class="font-bold text-primary/80 group-hover:text-accent"
              [class.text-accent]="branchStore.selectedBranch()?.branchId === option.branchId"
            >
              {{ option.name }}
            </p>

            <p class="text-[10px] text-secondary">
              {{ option.address }}
            </p>
          </div>
        </button>
      } @empty {
        <p class="p-2 text-sm text-secondary">{{ 'No branches available.' | translate }}</p>
      }
    </div>
  }
</div>
