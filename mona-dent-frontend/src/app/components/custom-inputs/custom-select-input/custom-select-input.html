<div
  class="relative"
  [class.w-full]="!widePanel()"
  [class.w-max]="widePanel()"
  [class.max-w-full]="widePanel()"
>
  <button
    type="button"
    class="flex min-w-0 max-w-full cursor-pointer items-center justify-between gap-2 rounded-lg border border-border bg-white px-3 py-2.5 text-sm transition-colors hover:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20 disabled:opacity-50"
    [class.w-full]="!widePanel()"
    [class.w-max]="widePanel()"
    [class.border-accent]="isOpen"
    [disabled]="disabled()"
    (click)="toggleDropdown()"
  >
    <span
      class="min-w-0 flex-1 whitespace-normal break-words text-left"
      [class.text-secondary]="!selectedOption"
    >
      {{ (selectedOption?.label ?? placeholder()) | translate }}
    </span>

    <svg
      lucideChevronDown
      class="ml-2 size-4 shrink-0 text-secondary transition-transform"
      [class.rotate-180]="isOpen"
    ></svg>
  </button>

  @if (widePanel()) {
    <div class="doctor-select-sizer" aria-hidden="true">
      @for (option of options(); track option.value) {
        <div class="doctor-select-sizer-row">
          @if (option.color) {
            <span class="doctor-color-dot" [style.background-color]="option.color"></span>
          }
          <span>{{ option.label | translate }}</span>
          <svg lucideCheck class="size-4 shrink-0"></svg>
        </div>
      }
    </div>
  }

  @if (isOpen) {
    <div
      class="absolute left-0 top-full z-50 mt-2 rounded-xl border border-border bg-white p-1 shadow-lg"
      [class.w-full]="!widePanel()"
      [class.doctor-filter-panel]="widePanel()"
    >
      <input
        #searchInput
        type="search"
        autocomplete="off"
        class="mb-1 w-full rounded-lg border border-border px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        [placeholder]="searchPlaceholder() | translate"
        [value]="searchTerm"
        (input)="onSearch($event)"
        (click)="$event.stopPropagation()"
      >

      <div #optionList class="max-h-52 overflow-y-auto">
        @for (option of filteredOptions; track option.value) {
          <button
            type="button"
            class="flex min-w-0 w-full cursor-pointer items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-left text-sm transition-colors hover:bg-background disabled:opacity-40"
            [style.background-color]="option.value === value() ? 'var(--color-accent-bg)' : null"
            [class.font-medium]="option.value === value()"
            [disabled]="option.disabled"
            [attr.data-selected]="option.value === value() ? 'true' : null"
            (click)="selectOption(option)"
          >
            @if (option.color) {
              <span class="doctor-color-dot" [style.background-color]="option.color" aria-hidden="true"></span>
            }
            <span class="min-w-0 flex-1 whitespace-normal break-words text-left leading-snug">{{ option.label | translate }}</span>

            @if (option.value === value()) {
              <svg lucideCheck class="size-4 shrink-0 text-accent"></svg>
            }
          </button>
        } @empty {
          <div class="px-3 py-4 text-center text-sm text-secondary">
            {{ (options().length ? 'No matching options' : 'No options available') | translate }}
          </div>
        }
      </div>
    </div>
  }
</div>
